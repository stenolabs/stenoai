name: e2e

# Tiered Playwright e2e. Drives the REAL Electron app.
# Branch protection requires T1 plus the macOS T2 and pipeline jobs for main.
# The Windows and Linux T2 jobs remain advisory while their headless-runner
# behavior is still being hardened.
#
#   t1-renderer (Ubuntu) - required privacy/lint ratchets plus renderer mock IPC.
#   build-backend-macos   -> t2-macos / t2-pipeline-macos   (whisper, CPU)
#   build-backend-windows -> t2-windows / t2-pipeline-windows (parakeet onnx, CPU)
#   build-backend-linux   -> t2-linux / t2-pipeline-linux     (parakeet onnx, CPU)
#     real bundled backend + mock org adapter; proves the keystone
#     path-isolation fix on every shipping platform.
#
# Explicit per-OS jobs (not a strategy.matrix) — mirrors the repo's paradigm and
# keeps the per-OS differences (exec bit, engine, process-kill, model cache)
# obvious in the CI logs. All three tiers run on every PR so the keystone
# isolation fix cannot silently regress on any platform.

on:
  workflow_dispatch:
  # Callable so the scheduled e2e-nightly workflow can re-run this exact suite
  # for flake/drift detection without duplicating the job definitions.
  workflow_call:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
  pull_request:
    paths-ignore:
      - 'website/**'

permissions:
  contents: read

jobs:
  # Hermetic renderer/main unit tests — node:test for the main-process
  # processing-log module + vitest (jsdom) for renderer hooks. No Electron,
  # Python, xvfb, or network, so it's fast and runs on every PR.
  unit-tests:
    name: Unit (node:test + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run unit tests (node:test + vitest)
        working-directory: app
        run: npm run test:unit

  t1-renderer:
    name: T1 (renderer + mock IPC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # T1 is already required by branch protection. Keep this scan here as
      # well as in the standalone workflow that covers website-only changes.
      - name: Scan tracked repository content for private fixtures
        run: python dev/scripts/repository_privacy_guard.py

      - name: Setup Python for required lint gate
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-lint.txt

      - name: Install Ruff
        run: python -m pip install -r requirements-lint.txt

      - name: Check Ruff ratchet
        run: python scripts/ruff_ratchet.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Electron dependencies
        working-directory: app
        run: npm ci

      - name: Lint main process
        working-directory: app
        run: npm run lint:main

      # Installs the shared libs Electron's Chromium needs on Linux, plus xvfb.
      - name: Install Linux system deps (+ xvfb)
        working-directory: app
        run: npx playwright install-deps

      - name: Build renderer
        working-directory: app
        run: npm run build:renderer

      # Electron is headless-hostile on Linux — run under a virtual framebuffer.
      # `@perf` is excluded: it is a measurement harness, not a gate, and
      # wall-clock work on a shared runner is not a number to block a PR on.
      # Run it by hand before and after a change to the live transcript
      # rendering (`--project=t1 --grep @perf`).
      - name: Run T1 under xvfb
        working-directory: app
        run: xvfb-run -a npm run test:e2e -- --project=t1 --grep-invert @perf

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-t1-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore

  lint-renderer:
    name: Lint (renderer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint renderer
        working-directory: app
        run: npm run lint:renderer

      # The i18n gate. Runs as its own step so a failure names itself in the job log
      # rather than hiding inside a generic lint failure.
      #
      # lint:i18n blocks NEW hardcoded user-facing strings (per-file ratchet against
      # renderer/i18n-lint-baseline.json). i18n:inventory records the existing English
      # wording, so an i18n migration can be shown to move strings without changing them
      # — the failure that broke three specs in PR #494 and read only as "CI is red".
      - name: i18n gate (no new hardcoded copy)
        working-directory: app
        run: npm run lint:i18n

      - name: i18n copy inventory is current
        working-directory: app
        run: npm run i18n:inventory
  # ---------------------------------------------------------------------------
  # Deterministic backend/renderer gates (issue #376). These close the CI
  # enforcement gap: the backend unittest suite and the renderer tsc typecheck
  # previously ran only on the maintainer's machine, so a green PR page didn't
  # mean the backend was green. They run on every PR but remain advisory. The
  # main-process lint and Ruff ratchet run unconditionally inside required T1.
  # ---------------------------------------------------------------------------

  # Runs on macos-latest (not ubuntu) on purpose: this is the platform the
  # maintainer runs `python -m unittest discover tests` on, and it's the only
  # runner where `pip install -r requirements.txt` is already proven green
  # (build-backend-macos installs the identical set, incl. the darwin-only
  # parakeet-mlx path). Bootstrap mirrors build-backend-macos minus the
  # PyInstaller/binary-download steps the tests don't need. Environment-gated
  # tests (e.g. the MLX-bundle wrapper) skip loudly when their artifact is absent.
  python-tests:
    name: Python (unittest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit tests
        run: python -m unittest discover tests

  # The maintainer's development Mac may run a newer beta. This job keeps the
  # helper's deployment floor honest on GitHub's stable macOS 26 image. The
  # smoke copy is deliberately re-signed without App Sandbox because public PR
  # runners do not have the project's Apple signing identity; release builds
  # verify the production sandbox entitlement after Developer ID signing.
  apple-lm-helper-macos26:
    name: Apple LM helper (macOS 26)
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify stable runtime and LaunchServices transport
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
          OPEN_HELP="$(/usr/bin/open --help 2>&1 || true)"
          grep -q -- '--stdin' <<< "$OPEN_HELP"
          grep -q -- '--stdout' <<< "$OPEN_HELP"
          grep -q -- '--stderr' <<< "$OPEN_HELP"
          grep -q -- '--env' <<< "$OPEN_HELP"

      - name: Build and launch Apple LM helper
        run: |
          chmod +x scripts/build-apple-lm-sidecar.sh
          ./scripts/build-apple-lm-sidecar.sh arm64
          mkdir -p build/apple-lm-smoke
          ditto "bin/Steno Apple LM.app" "build/apple-lm-smoke/Steno Apple LM.app"
          codesign --force --deep --sign - --options runtime "build/apple-lm-smoke/Steno Apple LM.app"
          export STENOAI_DISABLE_APPLE_LM=0
          export STENOAI_ENABLE_EXPERIMENTAL_APPLE_LM=1
          export STENOAI_USER_DATA_DIR="$(mktemp -d)"
          export STENOAI_E2E=1
          export STENOAI_APPLE_LM_BIN="$PWD/build/apple-lm-smoke/Steno Apple LM.app/Contents/MacOS/steno-apple-lm"
          python3 - <<'PY'
          from src.apple_lm import apple_lm_status

          status = apple_lm_status()
          assert isinstance(status.get("available"), bool), status
          assert status.get("reason") not in {
              "sidecar_error", "sidecar_missing", "experimental_disabled",
              "disabled", "unsupported_os",
          }, status
          print(status)
          PY

  # tsc --noEmit over the renderer (the typecheck:renderer script already exists;
  # CI just never called it). Mirrors the lint-renderer job's node bootstrap.
  typecheck-renderer:
    name: Typecheck (renderer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck renderer
        working-directory: app
        run: npm run typecheck:renderer

  build-backend-macos:
    name: Build backend bundle (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Partial speedup: skips PyInstaller Analysis when spec/deps are unchanged.
      # Never cache dist/ — that's the artifact we ship to the T2 job.
      - name: Cache PyInstaller work dir
        uses: actions/cache@v4
        with:
          path: build
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('stenoai.spec', 'requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download bundled binaries (Ollama + ffmpeg)
        run: |
          chmod +x scripts/download-ollama.sh
          ./scripts/download-ollama.sh

      - name: Build speaker-diarization sidecar (Swift/Core ML)
        run: |
          chmod +x scripts/build-diarize-sidecar.sh
          ./scripts/build-diarize-sidecar.sh "$(uname -m)"
          test -x bin/steno-diarize

      - name: Build backend with PyInstaller
        run: |
          pyinstaller stenoai.spec --noconfirm
          test -x dist/stenoai/_internal/steno-diarize

      # Guards the Ollama/pip-mlx libmlx.dylib ABI collision (see
      # scripts/verify_mlx_bundle.py). dlopen probes run here too - GitHub's
      # macos-latest arm64 runners resolve symbols fine without a Metal GPU.
      - name: Verify MLX bundle (libmlx ABI-collision guard)
        run: python scripts/verify_mlx_bundle.py

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-macos
          path: dist/stenoai
          retention-days: 3
          if-no-files-found: error

  t2-macos:
    name: T2 (real backend + mock adapter)
    runs-on: macos-latest
    needs: build-backend-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-backend-macos
          path: dist/stenoai

      # actions/upload-artifact strips the exec bit — without this the app can't
      # launch the bundled launcher / spawn ffmpeg or ollama (a cryptic-failure
      # trap, see the plan's risk #3). Match by name so the restore is agnostic
      # to PyInstaller's internal layout (e.g. the _internal/ contents dir).
      - name: Restore exec bits on bundled binaries
        run: |
          find dist/stenoai -type f \( -name stenoai -o -name ffmpeg -o -name ollama -o -name steno-diarize \) \
            -exec chmod +x {} +
          test -x dist/stenoai/stenoai  # fail loud if the launcher didn't get +x
          test -x dist/stenoai/_internal/steno-diarize

      # The app probes 11434 and skips its own `ollama serve` on a 200, so a real
      # Ollama on the runner would answer instead of a test stub. Kill it first
      # (the org-lock spec doesn't use Ollama, but this keeps T2 setup honest for
      # the summary/pipeline specs).
      - name: Ensure no stray Ollama
        run: pkill -f ollama || true

      - name: Install Electron dependencies
        working-directory: app
        run: npm ci

      - name: Build renderer
        working-directory: app
        run: npm run build:renderer

      # Exclude @pipeline AND @summarize-real — both need a real model and run in
      # their own model-bearing jobs (t2-pipeline-macos / the nightly
      # summarize-real-windows) so this job stays fast and model-free.
      - name: Run T2 (org-lock, model-free)
        working-directory: app
        run: npm run test:e2e -- --project=t2 --grep-invert '@pipeline|@summarize-real'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-t2-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Uses whisper.cpp (CPU), NOT parakeet-mlx: GitHub-hosted macOS runners are
  # headless VMs with no Metal GPU, so MLX can't load there ("Failed to load the
  # default metallib"). The plumbing + HEARTBEAT smoke is engine-agnostic, so
  # whisper exercises the same process-streaming path. Parakeet is covered on
  # real Macs locally / via /verify (and a future Metal-capable nightly runner).
  t2-pipeline-macos:
    name: T2 pipeline (transcribe + summarize)
    runs-on: macos-latest
    needs: build-backend-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-backend-macos
          path: dist/stenoai

      - name: Restore exec bits on bundled binaries
        run: |
          find dist/stenoai -type f \( -name stenoai -o -name ffmpeg -o -name ollama -o -name steno-diarize \) \
            -exec chmod +x {} +
          test -x dist/stenoai/stenoai
          test -x dist/stenoai/_internal/steno-diarize

      - name: Ensure no stray Ollama
        run: pkill -f ollama || true

      # Cache the whisper ggml weights (~1.6 GB for 'large-v3-turbo') so only the first
      # run pays the download; later runs restore in ~30 s. The model is NOT
      # bundled — it downloads on use into pywhispercpp's models dir.
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/pywhispercpp/models
          key: whisper-large-v3-turbo-ggml

      - name: Install Electron dependencies
        working-directory: app
        run: npm ci

      - name: Build renderer
        working-directory: app
        run: npm run build:renderer

      # Pre-download the model (no-op when the cache restored) so the test isn't
      # racing the download inside its timeout. pull-whisper-model exits 0 even
      # on failure, so verify the model is actually installed — otherwise the
      # spec would silently skip green and we'd ship "passing" with zero pipeline
      # coverage.
      - name: Ensure whisper model present
        run: |
          ./dist/stenoai/stenoai pull-whisper-model large-v3-turbo
          ./dist/stenoai/stenoai list-whisper-models \
            | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin)['supported_models']['large-v3-turbo']['installed'] else 1)"

      # Playwright exits 0 when --grep matches no tests. Assert the tagged spec
      # is actually selected so a future rename / dropped @pipeline tag can't
      # silently run zero tests and pass (the keystone-test-vanishes failure).
      - name: Guard — @pipeline test is selected
        working-directory: app
        run: npm run test:e2e -- --project=t2 --grep @pipeline --list | grep -q '@pipeline'

      - name: Run T2 pipeline (whisper)
        working-directory: app
        env:
          STENOAI_E2E_ENGINE: whisper
        run: npm run test:e2e -- --project=t2 --grep @pipeline

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-t2-pipeline-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Windows T2 — same shared-logic + pipeline specs on the other shipping OS.
  # Self-contained backend build: build-windows.yml doesn't run on PRs and
  # cross-workflow artifact reuse isn't possible, so we mirror build-backend-macos
  # here. No exec-bit restore (Windows has no exec bit) and the transcription
  # engine is onnx-asr (CPU) — which, unlike parakeet-mlx, DOES run on a
  # GPU-less hosted runner, so the Windows pipeline uses real parakeet-onnx.
  # ---------------------------------------------------------------------------
  build-backend-windows:
    name: Build backend bundle (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache PyInstaller work dir
        uses: actions/cache@v4
        with:
          path: build
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('stenoai.spec', 'requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # download-ollama.sh is a bash script; git bash is present on the runner.
      - name: Download bundled binaries (Ollama + ffmpeg)
        shell: bash
        run: |
          chmod +x scripts/download-ollama.sh
          ./scripts/download-ollama.sh

      - name: Build backend with PyInstaller
        run: pyinstaller stenoai.spec --noconfirm

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-windows
          path: dist/stenoai
          retention-days: 3
          if-no-files-found: error

  t2-windows:
    name: T2 (real backend + mock adapter, Windows)
    runs-on: windows-latest
    needs: build-backend-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-backend-windows
          path: dist/stenoai

      # No exec-bit restore: Windows has no exec bit (the macOS jobs need it
      # because upload-artifact strips +x). Stop any stray Ollama so the app's
      # 11434 probe can't answer against a pre-existing server (taskkill is the
      # Windows analog of the macOS pkill).
      - name: Ensure no stray Ollama
        shell: pwsh
        run: Stop-Process -Name ollama -Force -ErrorAction SilentlyContinue

      - name: Install Electron dependencies
        working-directory: app
        run: npm ci

      - name: Build renderer
        working-directory: app
        run: npm run build:renderer

      # Quote the grep: the default Windows shell is pwsh, which treats a bare
      # @word as splatting ($pipeline) and errors. Single quotes make it literal.
      # Exclude @summarize-real too — it's the nightly real-model summary smoke.
      - name: Run T2 (org-lock, model-free)
        working-directory: app
        run: npm run test:e2e -- --project=t2 --grep-invert '@pipeline|@summarize-real'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-t2-windows-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Windows transcription pipeline. Unlike t2-pipeline-macos (whisper, because
  # hosted Macs have no Metal for parakeet-mlx), Windows transcribes with
  # onnx-asr on CPU — so this runs the REAL parakeet path (STENOAI_E2E_ENGINE is
  # set to parakeet below). The onnx weights (~670 MB) aren't bundled; cache them
  # and pre-download so the spec isn't racing the pull inside its timeout.
  t2-pipeline-windows:
    name: T2 pipeline (transcribe + summarize, Windows)
    runs-on: windows-latest
    needs: build-backend-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-backend-windows
          path: dist/stenoai

      - name: Ensure no stray Ollama
        shell: pwsh
        run: Stop-Process -Name ollama -Force -ErrorAction SilentlyContinue

      # Cache the parakeet-onnx snapshot in the HuggingFace hub cache (HF's
      # default, used by parakeet_models._hf_cache_dir_for). Only the first run
      # pays the ~670 MB download; later runs restore in seconds.
      - name: Cache parakeet ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--istupakov--parakeet-tdt-0.6b-v3-onnx
          key: parakeet-onnx-${{ runner.os }}-tdt-0.6b-v3

      - name: Install Electron dependencies
        working-directory: app
        run: npm ci

      - name: Build renderer
        working-directory: app
        run: npm run build:renderer

      # Pre-download the model (no-op when the cache restored), then verify it's
      # actually installed. download-parakeet-model exits 0 even on a failed pull
      # (it reports via JSON), so the parakeet-status guard prevents the spec
      # from silently skipping green with zero pipeline coverage — mirrors the
      # whisper guard in t2-pipeline-macos.
      - name: Ensure parakeet model present
        shell: pwsh
        run: |
          ./dist/stenoai/stenoai.exe download-parakeet-model
          $status = ./dist/stenoai/stenoai.exe parakeet-status | ConvertFrom-Json
          if (-not $status.installed) {
            Write-Error "Parakeet ONNX model not installed after download"
            exit 1
          }

      # Assert the tagged spec is actually selected (Playwright exits 0 on a
      # zero-match --grep). git bash provides grep on the Windows runner. Capture
      # --list output first rather than piping into `grep -q`: on Windows the
      # early pipe-close from `grep -q` makes the node writer crash with EPIPE
      # (no POSIX SIGPIPE), failing the step even on a match.
      - name: Guard — @pipeline test is selected
        shell: bash
        working-directory: app
        run: |
          out=$(npm run test:e2e -- --project=t2 --grep @pipeline --list)
          echo "$out" | grep -q '@pipeline'

      # Quote '@pipeline' for the same pwsh-splat reason as the org-lock job.
      - name: Run T2 pipeline (parakeet onnx)
        working-directory: app
        env:
          STENOAI_E2E_ENGINE: parakeet
        run: npm run test:e2e -- --project=t2 --grep '@pipeline'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-t2-pipeline-windows-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Real PipeWire capture, on a runner. Everything else about Linux system
  # audio is tested against a stub: linux-loopback.t1 drives synthetic PCM
  # through the renderer bridge with mock IPC, and recording-lifecycle.t2
  # SKIPS on Linux ("system-audio path unsupported on this host") because a
  # bare runner has no PipeWire. So the part that actually talks to the OS —
  # isLinuxLoopbackSupported, getDefaultSinkName's pw-dump parsing, and
  # pw-record itself — had no automated coverage anywhere, only one
  # contributor's desktop. #502's own final commit records that the
  # frame-alignment fix was never confirmed against real audio.
  #
  # PipeWire runs headless here under dbus-run-session with a null sink, and a
  # known two-tone signal is played into it. That makes "captured only silence"
  # a failure rather than the normal state, which is what the developer-machine
  # script could never guarantee. This check is intentionally advisory while
  # its stability on hosted runners is established; promoting it to a required
  # branch-protection context is a separate maintainer decision.
  linux-loopback-pipewire:
    name: Linux loopback (real PipeWire)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test PipeWire readiness retries
        run: node --test scripts/wait-pipewire-sink.test.js

      # pipewire-pulse + pulseaudio-utils give us pactl/paplay to create the
      # sink and play into it; wireplumber is the session manager that actually
      # assigns nodes (without it, pw-dump reports no default sink).
      - name: Install PipeWire
        run: |
          sudo apt-get update
          sudo apt-get install -y pipewire pipewire-pulse wireplumber pulseaudio-utils dbus-x11

      - name: Capture real audio through the loopback module
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          node scripts/make-test-tone.js /tmp/tone.wav 20

          # One dbus session for the whole thing: pipewire, the playback and the
          # capture must share it or they see different graphs.
          dbus-run-session -- bash -euo pipefail -c '
            # Start in dependency order and WAIT between each. Launching all
            # three at once races: wireplumber connects before pipewire has its
            # socket, dies with "disconnected from pipewire", and without a
            # session manager there is no default-sink metadata — which then
            # surfaces confusingly as `pactl set-default-sink` returning
            # "Failure: Not supported".
            pipewire &
            for i in $(seq 1 30); do
              if pw-cli info 0 > /dev/null 2>&1; then echo "pipewire up after ${i}s"; break; fi
              if [ "$i" = 30 ]; then echo "::error::pipewire did not start"; exit 1; fi
              sleep 1
            done

            wireplumber &
            pipewire-pulse &
            for i in $(seq 1 30); do
              if pactl info > /dev/null 2>&1; then echo "pulse layer up after ${i}s"; break; fi
              if [ "$i" = 30 ]; then echo "::error::pipewire-pulse did not start"; exit 1; fi
              sleep 1
            done

            # A null sink stands in for a real output device. Its monitor is
            # what the app captures, so anything played to it is what we should
            # get back.
            pactl load-module module-null-sink sink_name=steno_test \
              sink_properties=device.description=StenoTest
            # Pulse can answer before WirePlumber accepts a default sink.
            # Retry the setter and check the active metadata via the same
            # getDefaultSinkName() reader used by the capture below.
            bash scripts/wait-pipewire-sink.sh steno_test
            echo "--- pipewire default metadata ---"
            pw-metadata -n default || true
            echo "--- sinks ---"
            pactl list short sinks

            # Loop so the tone outlasts the capture window regardless of timing.
            ( while true; do paplay --device=steno_test /tmp/tone.wav || true; done ) &
            PLAY_PID=$!
            trap "kill $PLAY_PID 2>/dev/null || true" EXIT
            sleep 2

            # The real module: resolves the default sink by name via pw-dump,
            # spawns pw-record against its monitor, and fails on a silent or
            # empty capture.
            node scripts/linux-loopback-poc-demo.js /tmp/captured.pcm
          '

      - name: Confirm the capture carries both channels
        run: |
          set -euo pipefail
          # The demo script proves "not silence". This proves the STEREO frame
          # layout survived: the tone is 440Hz left / 880Hz right, so a channel
          # that is silent, or two channels that are identical, means the frame
          # alignment or the channel mapping is wrong — the exact failure #502's
          # createFrameAligner exists to prevent, and which no test has ever
          # observed against real audio.
          node -e "
            const fs = require('fs');
            const { measurePeakRms } = require('./scripts/measure-pcm');
            const buf = fs.readFileSync('/tmp/captured.pcm');
            if (buf.length < 48000 * 4) throw new Error('capture too short: ' + buf.length + ' bytes');
            if (buf.length % 4 !== 0) throw new Error('capture is not a whole number of stereo frames: ' + buf.length);
            const frames = buf.length / 4;
            const left = Buffer.alloc(frames * 2);
            const right = Buffer.alloc(frames * 2);
            for (let i = 0; i < frames; i++) {
              left.writeInt16LE(buf.readInt16LE(i * 4), i * 2);
              right.writeInt16LE(buf.readInt16LE(i * 4 + 2), i * 2);
            }
            const L = measurePeakRms(left);
            const R = measurePeakRms(right);
            console.log('left  peak=' + L.peak + ' rms=' + L.rms.toFixed(1));
            console.log('right peak=' + R.peak + ' rms=' + R.rms.toFixed(1));
            if (L.peak === 0) throw new Error('left channel is silent');
            if (R.peak === 0) throw new Error('right channel is silent');
            if (left.equals(right)) throw new Error('channels are identical — stereo layout collapsed');

            // Which channel is which. Two sines at equal amplitude have equal
            // peak and near-equal RMS, so the checks above pass just as happily
            // on a SWAPPED pair. Counting zero crossings identifies the
            // frequency: the 880Hz channel must cross about twice as often as
            // the 440Hz one. Cheap, and robust on a clean tone.
            const crossings = (b) => {
              let n = 0;
              for (let i = 1; i < b.length / 2; i++) {
                const prev = b.readInt16LE((i - 1) * 2);
                const cur = b.readInt16LE(i * 2);
                if ((prev < 0 && cur >= 0) || (prev >= 0 && cur < 0)) n++;
              }
              return n;
            };
            const cl = crossings(left);
            const cr = crossings(right);
            const ratio = cr / cl;
            console.log('zero crossings: left=' + cl + ' right=' + cr + ' ratio=' + ratio.toFixed(2));
            if (!(ratio > 1.6 && ratio < 2.4)) {
              throw new Error(
                'expected right (880Hz) to cross ~2x as often as left (440Hz), got ratio ' +
                ratio.toFixed(2) + ' — channels are swapped or misaligned'
              );
            }
            console.log('PASS: real PipeWire capture, both channels present, distinct, and correctly ordered.');
          "

  build-backend-linux:
    name: Build backend bundle (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache PyInstaller work dir
        uses: actions/cache@v4
        with:
          path: build
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('stenoai.spec', 'requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download bundled binaries (Ollama + ffmpeg)
        run: |
          chmod +x scripts/download-ollama.sh
          ./scripts/download-ollama.sh

      - name: Build backend with PyInstaller
        run: pyinstaller stenoai.spec --noconfirm

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-linux
          path: dist/stenoai
          retention-days: 3
          if-no-files-found: error

  t2-linux:
    name: T2 (real backend + mock adapter, Linux)
    runs-on: ubuntu-latest
    needs: build-backend-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-backend-linux
          path: dist/stenoai

      # actions/upload-artifact strips the exec bit, same as the macOS job —
      # no steno-diarize here, it's mac-only.
      - name: Restore exec bits on bundled binaries
        run: |
          find dist/stenoai -type f \( -name stenoai -o -name ffmpeg -o -name ollama \) \
            -exec chmod +x {} +
          test -x dist/stenoai/stenoai

      - name: Ensure no stray Ollama
        run: pkill -f ollama || true

      # sounddevice (setup-check's audio-device enumeration) loads PortAudio
      # as a system shared lib at runtime — without it setup-check crashes
      # with "OSError: PortAudio library not found".
      - name: Install system audio deps (PortAudio)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install Electron dependencies
        working-directory: app
        run: npm ci

      # Electron is headless-hostile on Linux without a display server —
      # same reason t1-renderer needs this, see its comment above.
      - name: Install Linux system deps (+ xvfb)
        working-directory: app
        run: npx playwright install-deps

      - name: Build renderer
        working-directory: app
        run: npm run build:renderer

      - name: Run T2 (org-lock, model-free)
        working-directory: app
        run: xvfb-run -a npm run test:e2e -- --project=t2 --grep-invert '@pipeline|@summarize-real'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-t2-linux-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Same lane as Windows: onnx-asr on CPU, real parakeet path (not whisper —
  # that's only needed on macOS runners, which have no Metal for parakeet-mlx).
  t2-pipeline-linux:
    name: T2 pipeline (transcribe + summarize, Linux)
    runs-on: ubuntu-latest
    needs: build-backend-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-backend-linux
          path: dist/stenoai

      - name: Restore exec bits on bundled binaries
        run: |
          find dist/stenoai -type f \( -name stenoai -o -name ffmpeg -o -name ollama \) \
            -exec chmod +x {} +
          test -x dist/stenoai/stenoai

      - name: Ensure no stray Ollama
        run: pkill -f ollama || true

      - name: Install system audio deps (PortAudio)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Cache parakeet ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--istupakov--parakeet-tdt-0.6b-v3-onnx
          key: parakeet-onnx-${{ runner.os }}-tdt-0.6b-v3

      - name: Install Electron dependencies
        working-directory: app
        run: npm ci

      - name: Install Linux system deps (+ xvfb)
        working-directory: app
        run: npx playwright install-deps

      - name: Build renderer
        working-directory: app
        run: npm run build:renderer

      - name: Ensure parakeet model present
        run: |
          ./dist/stenoai/stenoai download-parakeet-model
          ./dist/stenoai/stenoai parakeet-status | grep -q '"installed": *true' || {
            echo "Parakeet ONNX model not installed after download"; exit 1;
          }

      - name: Guard — @pipeline test is selected
        working-directory: app
        run: |
          out=$(npm run test:e2e -- --project=t2 --grep @pipeline --list)
          echo "$out" | grep -q '@pipeline'

      - name: Run T2 pipeline (parakeet onnx)
        working-directory: app
        env:
          STENOAI_E2E_ENGINE: parakeet
        run: xvfb-run -a npm run test:e2e -- --project=t2 --grep '@pipeline'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-t2-pipeline-linux-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore
