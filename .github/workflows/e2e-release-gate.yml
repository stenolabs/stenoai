name: e2e-release-gate

# Pre-tag release gate. The full e2e suite, run BEFORE the immutable version tag
# exists, so a regression in any covered area blocks the release instead of
# reaching users.
#
# Why a release/* branch and not build-release.yml: build-release.yml triggers on
# `git push tag vX.Y.Z` — by then the tag is already created, so a failing gate
# there would leave a "tag exists but release failed" mess to unwind. Gating on
# the release branch puts the green/red signal in front of the human BEFORE they
# cut the tag. Release flow (see CLAUDE.md "Release Process"):
#   1. branch  release/vX.Y.Z  off main
#   2. this workflow runs the full matrix
#   3. tag ONLY once it is green  ->  build-release.yml builds + ships
#
# Unlike e2e.yml (advisory/non-blocking per-PR), the human treats THIS run as a
# hard prerequisite for the tag. The jobs themselves fail on any spec failure, so
# the workflow conclusion is the gate.
#
# The T3 @long-meeting smoke is part of the gate: `run_long_meeting: true` makes
# e2e.yml run it off the Windows bundle it builds, in parallel with the T2
# shards, so the gate finishes in about the time of the per-PR suite instead of
# suite + T3 back to back.
#
# Manually triggerable (workflow_dispatch) to dry-run the gate without a branch.
# `rebuild_backend` forces fresh PyInstaller bundles instead of the input-hash
# cache (the content hash already guarantees identical inputs; this is for
# re-checking pip/Ollama drift before a release).

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      rebuild_backend:
        description: Ignore the cached backend bundles and rebuild them with PyInstaller
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Full per-PR suite + T3: T1 (Ubuntu) + macOS/Windows/Linux T2 (model-free)
  # + macOS/Windows/Linux @pipeline (transcribe + summarize) + the Windows
  # @long-meeting chunking smoke. Reused verbatim via `uses:` so there's no job
  # duplication and the gate can never drift from what PRs run.
  suite:
    name: Full suite (release gate)
    uses: ./.github/workflows/e2e.yml
    with:
      run_long_meeting: true
      rebuild_backend: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_backend == true }}
