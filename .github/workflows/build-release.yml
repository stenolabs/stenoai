name: Build and Release DMG

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # Backstop gate. The real release gate is e2e-release-gate.yml on the release/*
  # branch (full matrix, run BEFORE the tag). This is defense-in-depth for the
  # case where a tag is pushed without going through that branch gate: a fast,
  # hermetic T1 smoke (renderer + mock IPC, no Python backend, no models, no
  # network) that build-macos depends on, so we can't sign + ship on a broken
  # renderer / IPC contract. Deliberately T1-only — the heavy backend/model/ML
  # coverage belongs to the branch gate + nightly, not the critical release path.
  gate-smoke:
    name: Release gate smoke (T1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Electron dependencies
        working-directory: app
        run: npm ci

      - name: Install Linux system deps (+ xvfb)
        working-directory: app
        run: npx playwright install-deps

      - name: Build renderer
        working-directory: app
        run: npm run build:renderer

      # `@perf` excluded - a measurement harness, not a release gate (see
      # e2e.yml for the same exclusion).
      - name: Run T1 under xvfb
        working-directory: app
        run: xvfb-run -a npm run test:e2e -- --project=t1 --grep-invert @perf

  build-macos:
    needs: gate-smoke
    # Apple-Silicon only as of v0.4.0. macOS 26 (Tahoe) drops Intel and
    # our headline transcription engine (Parakeet TDT v3 via MLX) is
    # Apple-Silicon only, so the Intel build was shipping a degraded
    # product anyway. Intel users stay on v0.3.8 — auto-update is gated
    # via `electron-builder.mac.notarize.teamId` + the `arm64`-only
    # latest-mac.yml below, so Intel installs of v0.3.8 won't even see
    # this release.
    strategy:
      matrix:
        include:
          - arch: arm64
            build_cmd: build:arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: app/package-lock.json

    - name: Get version from package.json
      id: package_version
      working-directory: app
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download bundled binaries (Ollama, ffmpeg)
      run: |
        chmod +x scripts/download-ollama.sh
        ./scripts/download-ollama.sh
        # Fail loudly if the bundled ffmpeg isn't arm64 — an x86_64 ffmpeg in the
        # arm64 build crashes on Apple Silicon without Rosetta (#209). Mirrors the
        # mic-monitor arch guard below.
        file bin/ffmpeg
        file bin/ffmpeg | grep -q "arm64"

    - name: Thin bundled binaries to ${{ matrix.arch }}
      run: |
        chmod +x scripts/thin-macos-bin.sh
        # Idempotent — download-ollama.sh already ran it for the host arch. Run it
        # again with the explicit target arch so a cached or hand-populated bin/
        # can't smuggle x86_64 code into the signed bundle (#427). The script
        # exits non-zero if any non-arm64 Mach-O survives.
        ./scripts/thin-macos-bin.sh ${{ matrix.arch }}
        file bin/ollama
        file bin/ollama | grep -q "arm64"

    - name: Build mic-monitor helper (Swift)
      run: |
        chmod +x scripts/build-mic-monitor.sh
        ./scripts/build-mic-monitor.sh arm64
        file bin/mic-monitor
        # Fail loudly if the binary isn't arm64 — silent mismatches would
        # ship users a Rosetta'd helper.
        file bin/mic-monitor | grep -q "arm64"

    - name: Build speaker-diarization sidecar (Swift/Core ML)
      run: |
        chmod +x scripts/build-diarize-sidecar.sh
        ./scripts/build-diarize-sidecar.sh arm64
        test -x bin/steno-diarize
        file bin/steno-diarize
        file bin/steno-diarize | grep -q "arm64"

    - name: Build Apple transcription sidecar (Swift/Speech)
      run: |
        chmod +x scripts/build-transcribe-sidecar.sh
        ./scripts/build-transcribe-sidecar.sh arm64
        test -x bin/steno-transcribe
        file bin/steno-transcribe
        file bin/steno-transcribe | grep -q "arm64"

    - name: Build Python backend with PyInstaller
      run: |
        pyinstaller stenoai.spec --noconfirm
        # Verify build and architecture
        ls -la dist/stenoai/
        file dist/stenoai/stenoai
        test -x dist/stenoai/_internal/steno-diarize
        file dist/stenoai/_internal/steno-diarize | grep -q "arm64"
        test -x dist/stenoai/_internal/steno-transcribe
        file dist/stenoai/_internal/steno-transcribe | grep -q "arm64"
        echo "Expected arch: ${{ matrix.arch }}"
        echo "Backend built successfully"

    # Blocks the DMG build if the Ollama/pip-mlx libmlx.dylib ABI collision has
    # re-appeared (see scripts/verify_mlx_bundle.py) - a shipped-but-broken MLX
    # summarization path is exactly what this release gate must catch.
    - name: Verify MLX bundle (libmlx ABI-collision guard)
      run: python scripts/verify_mlx_bundle.py

    - name: Install Electron dependencies
      working-directory: app
      run: npm ci

    - name: Import code signing certificate
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
        p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

    - name: Build and notarize DMG for ${{ matrix.arch }}
      working-directory: app
      # --publish=never is critical: electron-builder has a `publish` config
      # (github provider) and GH_TOKEN in env, so without this it auto-creates
      # a DRAFT GitHub release for the tag and uploads the DMG there. That draft
      # is redundant — the real release is created by the `release` job below
      # (softprops/action-gh-release) from the CI artifacts — and worse, the
      # Windows job (build-windows.yml) would race and upload its .exe onto that
      # stray draft instead of the published release, 404'ing the website link.
      run: npm run ${{ matrix.build_cmd }} -- --publish=never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    # Write the macOS floor into the update manifest (#432). The runtime gate in
    # app/update-os-gate.js cannot protect the installs that are actually at
    # risk: it only runs inside a build that already meets the floor, while the
    # machines that would be bricked are running the PREVIOUS release. Only
    # latest-mac.yml reaches them — electron-updater checks its
    # `minimumSystemVersion` before it reports an update or downloads one.
    #
    # electron-builder does NOT write that field. `mac.minimumSystemVersion`
    # only reaches Info.plist (app-builder-lib macPackager.js) and `ReleaseInfo`
    # in its schema is additionalProperties:false. Verified against 26.8.1: a
    # build with mac.minimumSystemVersion set emits the plist key and a
    # latest-mac.yml with zero occurrences of minimumSystemVersion.
    #
    # The value MUST be the DARWIN version — electron-updater compares against
    # os.release(), which on macOS is the kernel version. The product floor
    # 14.4.0 would be a silent no-op, since macOS 12 reports Darwin 21.6.0.
    # darwinFloorForMacos() does the translation from the same constant the
    # runtime gate uses, so the two can never disagree.
    #
    # Runs here rather than in the release job because `npm ci` has run, so the
    # patched manifest can be re-parsed with a real YAML parser instead of being
    # eyeballed. A missing js-yaml (electron-builder's, hoisted) fails the step —
    # the right direction: never publish an ungated manifest.
    - name: Write the macOS floor into the update manifest
      working-directory: app
      run: |
        node -e "
          const fs = require('fs');
          const yaml = require('js-yaml');
          const { darwinFloorForMacos, MIN_MACOS_FOR_AUTOUPDATE } = require('./update-os-gate');
          const file = 'dist/latest-mac.yml';

          const floor = darwinFloorForMacos(MIN_MACOS_FOR_AUTOUPDATE);
          const before = fs.readFileSync(file, 'utf8');
          const parsed = yaml.load(before);
          if (!parsed || typeof parsed !== 'object') {
            throw new Error('latest-mac.yml did not parse as a mapping');
          }
          if (parsed.minimumSystemVersion !== undefined) {
            throw new Error('latest-mac.yml already carries minimumSystemVersion — electron-builder gained native support, so check the value is the DARWIN one before removing this step');
          }

          const patched = before.replace(/\n*\$/, '\n') + 'minimumSystemVersion: ' + floor + '\n';
          // Re-parse: proves the append produced ONE valid document with the key
          // at the root, whatever shape the serializer emitted (a document
          // marker or a flow-style root would throw or land the key elsewhere).
          const after = yaml.load(patched);
          if (after.minimumSystemVersion !== floor) {
            throw new Error('patched manifest reads back as ' + JSON.stringify(after.minimumSystemVersion));
          }
          for (const key of ['version', 'files', 'path', 'sha512', 'releaseDate']) {
            if (JSON.stringify(after[key]) !== JSON.stringify(parsed[key])) {
              throw new Error('patching altered ' + key);
            }
          }

          fs.writeFileSync(file, patched);
          console.log('Gated latest-mac.yml (minimumSystemVersion: ' + floor + ', i.e. macOS ' + MIN_MACOS_FOR_AUTOUPDATE + '):');
          console.log(patched);
        "

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.arch }}
        path: |
          app/dist/*.dmg
          app/dist/*.zip
          app/dist/*.yml
          app/dist/*.yaml
        retention-days: 1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Get version from package.json
      id: package_version
      working-directory: app
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Extract annotated tag message
      id: tag_body
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        # actions/checkout@v4 with fetch-tags: true sometimes leaves the
        # annotated tag as a lightweight pointer (just the commit OID,
        # no annotation object), which makes `for-each-ref --format=
        # '%(contents:body)'` return empty. The action-gh-release step
        # below then falls back to the commit subject in the release
        # body — that's how every prior release ended up with
        # "chore(release): prep vX.Y.Z" as its body instead of the
        # actual notes we wrote on the tag. Refetch the tag explicitly
        # so the annotation object is present locally before we read it.
        git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
        # Pull the body of the annotated tag (strips the PGP signature if any).
        # Falls back to the tag subject if the body is empty (one-line tag).
        MSG=$(git for-each-ref --format='%(contents:body)' "refs/tags/${{ github.ref_name }}")
        if [ -z "$MSG" ]; then
          MSG=$(git for-each-ref --format='%(contents:subject)' "refs/tags/${{ github.ref_name }}")
        fi
        # Full contents (subject + body) for the Discord announcer: the tag
        # SUBJECT is the release's one-line summary, and %(contents:body) drops
        # it — which left the announcement with a generic fallback summary. The
        # GitHub Release body still uses `text` (body only); the announcer uses
        # `text_full` so its summary line survives.
        FULL=$(git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}")
        {
          echo 'text<<STENO_RELEASE_EOF'
          echo "$MSG"
          echo 'STENO_RELEASE_EOF'
          echo 'text_full<<STENO_RELEASE_FULL_EOF'
          echo "$FULL"
          echo 'STENO_RELEASE_FULL_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -name "*.dmg" -exec cp {} release/ \;
        find artifacts -name "*.zip" -exec cp {} release/ \;
        # Single-arch release (arm64) as of v0.4.0 — the per-arch
        # latest-mac.yml from the build job is the published auto-update
        # manifest.
        cp artifacts/build-arm64/latest-mac.yml release/latest-mac.yml
        # The build job writes the macOS floor into this manifest (#432).
        # Re-derive it here and require an exact match, so a removed, reordered
        # or half-applied step cannot publish a feed that offers the build to
        # Macs which cannot launch it. update-os-gate.js is dependency-free, so
        # this needs no node_modules in the release job.
        MIN_DARWIN=$(node -e "
          const m = require('./app/update-os-gate');
          process.stdout.write(m.darwinFloorForMacos(m.MIN_MACOS_FOR_AUTOUPDATE));
        ")
        if ! grep -qx "minimumSystemVersion: ${MIN_DARWIN}" release/latest-mac.yml; then
          echo "::error::latest-mac.yml does not carry 'minimumSystemVersion: ${MIN_DARWIN}' — refusing to publish an ungated update manifest (see #432)."
          exit 1
        fi
        echo "Published latest-mac.yml:"
        cat release/latest-mac.yml
        ls -la release/
        # Website-friendly alias for the arm64 DMG.
        cd release
        for dmg in *.dmg; do
          if [[ "$dmg" == *"-arm64.dmg" ]]; then
            cp "$dmg" "stenoAI-macos-arm64.dmg"
          fi
        done
        ls -la

    - name: Create Release with Assets
      uses: softprops/action-gh-release@v1
      with:
        name: Steno ${{ github.event.inputs.version || steps.package_version.outputs.version }}
        body: |
          ## Steno v${{ github.event.inputs.version || steps.package_version.outputs.version }}

          ${{ steps.tag_body.outputs.text }}

          ### Downloads

          - **Apple Silicon (M1-M5)**: [`stenoAI-macos-arm64.dmg`](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version || steps.package_version.outputs.version }}/stenoAI-macos-arm64.dmg)

          The `.zip` and `.yml` assets below are used by the in-app auto-updater - no need to download them manually.

          ### First Time Setup
          1. Download the DMG
          2. Install by dragging Steno to Applications
          3. Launch app - setup wizard runs automatically
          4. Grant microphone permissions when prompted
          5. Start recording meetings!

          ### Requirements
          - **Apple Silicon Mac (M1 or later)** - Intel Macs are not supported (since v0.4.0)
          - macOS 14.4 (Sonoma) or later
          - Internet connection for initial setup
          - Microphone access permissions

          ### Intel Mac users
          Steno is **Apple Silicon only** (since v0.4.0). Intel users should stay on [v0.3.8](https://github.com/stenolabs/stenoai/releases/tag/v0.3.8), the last release supporting Intel Macs. Auto-update on existing Intel installs is gated and will not offer newer versions to those machines.
        files: |
          release/*.dmg
          release/*.zip
          release/*.yml
          release/*.yaml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Announce the release in Discord. Lives here (not a separate
    # `on: release: published` workflow) because the release above is created
    # with GITHUB_TOKEN, and GitHub does NOT fire downstream workflow triggers
    # for GITHUB_TOKEN-authored events — so a standalone announce workflow would
    # never run. continue-on-error + the script's no-webhook no-op guarantee a
    # Discord problem can never fail the actual release. No-ops until the
    # DISCORD_WEBHOOK_URL repo secret is set (so forks stay quiet).
    - name: Setup Node.js (Discord announce)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Announce release on Discord
      if: startsWith(github.ref, 'refs/tags/v')
      continue-on-error: true
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        VERSION: ${{ github.event.inputs.version || steps.package_version.outputs.version }}
        RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ github.event.inputs.version || steps.package_version.outputs.version }}
        RELEASE_NOTES: ${{ steps.tag_body.outputs.text_full }}
      run: node scripts/discord-release-announce.mjs
