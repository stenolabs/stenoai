# Gradual type checking (#376). Only the modules listed under `files` are
# checked; they pass today and must keep passing. Everything else is imported
# silently (follow_imports) so untyped code and third-party packages do not
# widen the scope.
#
# To add the next module:
#   1. python -m mypy --config-file mypy.ini src/<module>.py   (add the path to
#      `files` first, or run it on the single file with the config)
#   2. Fix what it reports with behaviour-neutral annotations only. If it needs
#      real refactoring, leave the module out.
#   3. Append src/<module>.py to `files` below and run the full command:
#      python -m mypy --config-file mypy.ini
# Never remove a module from the list to make CI pass; fix the error instead.
#
# Run from the repo root; CI uses the version pinned in requirements-lint.txt.
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
files =
    src/_heartbeat.py,
    src/_parakeet_onnx.py,
    src/call_info.py,
    src/chat_query.py,
    src/chinese.py,
    src/folders.py,
    src/language_detect.py,
    src/models.py,
    src/parakeet.py,
    src/parakeet_models.py,
    src/report_store.py,
    src/reports.py,
    src/speaker_schema.py,
    src/voiceprint.py,
    src/whisper_models.py
